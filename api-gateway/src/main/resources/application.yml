server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # /app1/** -> resolved to a live APP1 instance via Eureka + LoadBalancer
        - id: app1-route
          uri: lb://APP1
          predicates:
            - Path=/app1/**
        # /app2/** -> resolved to a live APP2 instance via Eureka + LoadBalancer
        - id: app2-route
          uri: lb://APP2
          predicates:
            - Path=/app2/**

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVER_URL:http://localhost:8761}/eureka
