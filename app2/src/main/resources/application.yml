server:
  port: 8082
  servlet:
    # Defaults to /app2 locally too -- see app1/application.yml's identical comment for why.
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/app2}

spring:
  application:
    name: app2

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVER_URL:http://localhost:8761}/eureka
  instance:
    prefer-ip-address: false
    hostname: ${SERVICE_HOSTNAME:localhost}
    nonSecurePort: ${SERVICE_ADVERTISE_PORT:8082}
